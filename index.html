<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal sinusoïdal — démo interactive</title>
  <link rel="stylesheet" href="./style.css?v=3">
</head>

<body>
  <main class="app">
    <section class="card">
      <h1 class="title">Sinus interactif</h1>
      <button id="themeToggle" class="theme-btn" title="Basculer clair/sombre"
        aria-label="Basculer clair/sombre">🌗</button>

      <div class="formula" id="formula">
        u(t) = <span class="tok umoy">U<sub>moy</sub></span> + <span class="tok umax">U<sub>max</sub></span> · sin(2π ·
        <span class="tok f">f</span> · t + <span class="tok phi">φ</span>)
        <div class="muted" style="margin-top:6px">
          u(t) = <span class="tok umoy" id="numDC">0 V</span> + <span class="tok umax" id="numU">5</span> · sin(2π ·
          <span class="tok f" id="numF">50</span> · t + <span class="tok phi" id="numP">0°</span>)
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="scope" width="1000" height="320" aria-label="Graphique du signal"></canvas>
      </div>

      <div class="controls">
        <!-- Ordre : Umoy, Umax, f, φ -->
        <div class="control">
          <label for="uDc">
            <span class="lhs">U<sub>moy</sub>(V)</span>
            <span class="value tok umoy" id="uDcOut">0.00 V</span>
          </label>
          <input id="uDc" type="range" min="-20" max="20" step="0.01" value="0">
        </div>

        <div class="control">
          <label for="uMax">
            <span class="lhs">U<sub>max</sub>(V)</span>
            <span class="value tok umax" id="uMaxOut">5.00 V</span>
          </label>
          <input id="uMax" type="range" min="0" max="20" step="0.01" value="5">
          <div class="sub"><span class="tok umax">U<sub>eff</sub> = U<sub>max</sub>/√2 = </span><span class="tok umax"
              id="ueffOut">3.54 V</span></div>
        </div>

        <div class="control">
          <label for="freq">
            <span class="lhs">f(Hz)</span>
            <span class="value tok f" id="freqOut">50.00 Hz</span>
          </label>
          <input id="freq" type="range" min="0.1" max="2000" step="0.1" value="50">
          <div class="sub"><span class="tok f">T = 1/f = </span><span class="tok f" id="tOut">20.00 ms</span></div>
        </div>

        <div class="control">
          <label for="phase">
            <span class="lhs">φ(°)</span>
            <span class="value tok phi" id="phaseOut">0.0°</span>
          </label>
          <input id="phase" type="range" min="-180" max="180" step="0.1" value="0">
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>

  <footer class="app-footer" aria-label="Crédit">Conçu par <strong>David Chessa</strong></footer>
</body>

</html>
